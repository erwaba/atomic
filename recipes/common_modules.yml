
modules:
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
  - type: dnf
    install:
      packages:
# for backups
        - restic
# for mounting networked drives
        - autofs
# for burning CDs/DVDs
        - k3b
# for connecting to mobile devices
        - libimobiledevice
# for dotfile management
        - chezmoi
# required by Winboat (when using podman)
        - podman-compose
# for container and VM management
        - incus
        - incus-tools
# for incus to be able to run VMs
        - qemu
# for encryption and a SOPS backend
        - age
# for reversion to SDDM login manager until hide users feature is added
        - sddm
        - sddm-kcm
        - sddm-wayland-plasma
        - sddm-breeze
# install starship (but do not set as default for any users)
#  - type: script
#    scripts:
#    - starship.sh
# include containerfile that installs SOPS
  - type: containerfile
    containerfiles:
      - SOPS
  - type: files
# delete tmpfile that creates/chowns the empty linuxbrew directories each boot (via systemd-tmpfiles-setup.service)
  - type: script
    snippets:
      - "rm -f /usr/lib/tmpfiles.d/homebrew.conf"
# disable services and timers that populate or update the /var/home/linuxbrew directories
    system:
      disabled:
        - brew-setup.service
        - brew-update.timer
        - brew-upgrade.timer
# copies uupd conf dropin file disabling timer-driven brew updates to proper location
    files:
      - source: system
        destination: /
  - type: systemd
